server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (Phase 10) — same values the backend API already
    # sends in app/middleware/security_headers.py, applied here too since
    # this container serves the actual HTML/JS/CSS the browser renders.
    # HSTS is deliberately NOT set here: this server only listens on plain
    # HTTP (TLS is expected to be terminated upstream, e.g. by a reverse
    # proxy/load balancer) and a container that can't tell whether it's
    # being reached over HTTP or HTTPS shouldn't assert HSTS itself — add
    # it at whichever layer actually terminates TLS instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # connect-src needs your real backend API origin (the same host
    # VITE_API_BASE_URL points at) — replace <YOUR_API_ORIGIN> below before
    # deploying, e.g. connect-src 'self' https://api.cybershield.example.com
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' <YOUR_API_ORIGIN>; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's content-hash build output) are safe to
    # cache aggressively; index.html itself must always be revalidated so a
    # new deploy is picked up on next visit instead of being cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
